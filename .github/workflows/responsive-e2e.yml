name: BLA-112 responsive E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  public-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run public responsive matrix
        run: bun run test:e2e:public
      - name: Upload BLA-112 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bla-112-responsive-evidence-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14
